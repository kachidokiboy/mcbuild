[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcbuild"
version = "0.1.0"
description = "AI building builder for Minecraft Java Edition"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mcbuild = "mcbuild.cli:main"

[tool.setuptools]
packages = ["mcbuild"]
